name: XOXO Streaks BETA tests

on:
  push:
    branches:
      - feature/xoxo-streaks-beta
    paths:
      - "beta/xoxo-streaks.js"
      - "beta/xoxo-streaks-chat-bridge.js"
      - "beta/xoxo-streaks-beta-host.js"
      - "beta/test-streaks-beta-deploy-contract.cjs"
      - "beta/build-streaks-beta-assets.sh"
      - "wrangler.streaks-beta.jsonc"
      - ".github/workflows/xoxo-streaks-beta-deploy.yml"
      - "beta/xoxo-streaks-schema.sql"
      - "beta/test-xoxo-streaks.cjs"
      - ".github/workflows/xoxo-streaks-beta-tests.yml"
  pull_request:
    paths:
      - "beta/xoxo-streaks.js"
      - "beta/xoxo-streaks-chat-bridge.js"
      - "beta/xoxo-streaks-schema.sql"
      - "beta/test-xoxo-streaks.cjs"
      - ".github/workflows/xoxo-streaks-beta-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test XOXO Streaks BETA contract
        run: |
          node beta/test-xoxo-streaks.cjs
          node beta/test-streaks-beta-deploy-contract.cjs
