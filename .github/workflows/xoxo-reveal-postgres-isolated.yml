name: XOXO Reveal isolated PostgreSQL smoke
on:
  workflow_dispatch:
  push:
    branches:
      - feature/xoxo-reveal-studio-beta
    paths:
      - '.github/workflows/xoxo-reveal-postgres-isolated.yml'
      - 'tests/xoxo-reveal-postgres-isolated-smoke.sql'
jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xoxo_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: xoxo_reveal_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xoxo_test -d xoxo_reveal_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated PostgreSQL target and run smoke test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: xoxo_test
          PGPASSWORD: isolated_test_only
          PGDATABASE: xoxo_reveal_test_ci
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'xoxo_reveal_test_ci'
          test "$PGUSER" = 'xoxo_test'
          psql -X -v ON_ERROR_STOP=1 -f tests/xoxo-reveal-postgres-isolated-smoke.sql
# This workflow intentionally does NOT read Supabase secrets, connect to
# production, apply any REVIEW_ONLY migrations, or access live user data.
