name: XOXO Reveal isolated PostgreSQL smoke
on:
  workflow_dispatch:
  push:
    branches:
      - feature/xoxo-reveal-studio-beta
    paths:
      - '.github/workflows/xoxo-reveal-postgres-isolated.yml'
      - 'tests/xoxo-reveal-postgres-isolated-smoke.sql'
      - 'tests/xoxo-reveal-postgres-transactional-fixture.sql'
      - 'tests/xoxo-reveal-postgres-refund-concurrency.sh'
      - 'tests/xoxo-reveal-postgres-refund-v2-setup.sql'
      - 'tests/xoxo-reveal-postgres-refund-v2-behavior.sql'
      - 'tests/xoxo-reveal-postgres-refund-v2-authorization.sql'
      - 'supabase/migrations/20261019_xoxo_reveal_release_quota_v2_REVIEW_ONLY.sql'
jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xoxo_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: xoxo_reveal_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xoxo_test -d xoxo_reveal_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated PostgreSQL target and run transactional fixtures
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: xoxo_test
          PGPASSWORD: isolated_test_only
          PGDATABASE: xoxo_reveal_test_ci
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'xoxo_reveal_test_ci'
          test "$PGUSER" = 'xoxo_test'
          psql -X -v ON_ERROR_STOP=1 -f tests/xoxo-reveal-postgres-isolated-smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/xoxo-reveal-postgres-transactional-fixture.sql
          bash tests/xoxo-reveal-postgres-refund-concurrency.sh
          psql -X -v ON_ERROR_STOP=1 -f tests/xoxo-reveal-postgres-refund-v2-setup.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261019_xoxo_reveal_release_quota_v2_REVIEW_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/xoxo-reveal-postgres-refund-v2-behavior.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/xoxo-reveal-postgres-refund-v2-authorization.sql
# No Supabase secrets, production connections, live data, or REVIEW_ONLY migrations.
