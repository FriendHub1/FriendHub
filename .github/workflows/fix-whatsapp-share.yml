name: Fix WhatsApp localized share

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WhatsApp share fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          text = p.read_text()
          marker = '<script id="xoxo-whatsapp-localized-share-fix">'
          if marker not in text:
              script = r'''<script id="xoxo-whatsapp-localized-share-fix">
          (function(){
            try {
              var original="Join me on XOXO Avenue — meet people, discover communities and make new friends!";
              var messages={
                it:"Unisciti a me su XOXO Avenue — conosci nuove persone, scopri community e fai nuove amicizie!",
                sv:"Häng med mig på XOXO Avenue — träffa nya människor, upptäck gemenskaper och få nya vänner!",
                de:"Komm zu XOXO Avenue — lerne neue Menschen kennen, entdecke Communities und finde neue Freunde!"
              };
              function lang(){
                var q=new URLSearchParams(location.search).get("lang");
                if(q) return String(q).toLowerCase();
                try { var s=localStorage.getItem("friendhub_language"); if(s) return String(s).toLowerCase(); } catch(e){}
                return String(document.documentElement.lang||"").toLowerCase();
              }
              function rewrite(value){
                if(typeof value!=="string" || !/^(?:https?:)?\\/\\/(?:wa\\.me|api\\.whatsapp\\.com)\\//i.test(value)) return value;
                var l=lang(), message=messages[l];
                if(!message) return value;
                try{
                  var u=new URL(value,location.href);
                  var current=u.searchParams.get("text")||"";
                  if(current===original || decodeURIComponent(current).indexOf(original)!==-1){
                    u.searchParams.set("text",message);
                    return u.toString();
                  }
                }catch(e){}
                return value;
              }
              var nativeOpen=window.open;
              window.open=function(url,target,features){
                return nativeOpen.call(window,rewrite(url),target,features);
              };
              if(navigator.share){
                var nativeShare=navigator.share.bind(navigator);
                navigator.share=function(data){
                  if(data && typeof data.text==="string"){
                    var l=lang();
                    if(messages[l] && data.text.indexOf(original)!==-1) data=Object.assign({},data,{text:data.text.replace(original,messages[l])});
                  }
                  return nativeShare(data);
                };
              }
              document.addEventListener("click",function(event){
                var a=event.target&&event.target.closest?event.target.closest("a[href]"):null;
                if(a) a.href=rewrite(a.href);
              },true);
            }catch(e){}
          })();
          </script>'''
              pos=text.rfind("</body>")
              if pos<0: raise SystemExit("</body> not found")
              text=text[:pos]+script+"\n"+text[pos:]
              p.write_text(text)
          else:
              print("Fallback already present")
      - name: Remove temporary inspection workflow
        run: rm -f .github/workflows/inspect-share.yml
      - name: Commit fix
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/inspect-share.yml .github/workflows/fix-whatsapp-share.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix WhatsApp localized share"
          git push
