name: Fix localized WhatsApp message

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-whatsapp-localized-message.yml"
      - ".github/workflows/inspect-share.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Worker WhatsApp message handling
        shell: python
        run: |
          from pathlib import Path

          worker = Path("worker.js")
          text = worker.read_text(encoding="utf-8")

          marker = 'id="xoxo-localized-share-hotfix-v2"'
          if marker not in text:
              needle = '''    .transform(response);'''
              script = '''    .on("head", {\n      element(element) {\n        element.append(`\n<script id="xoxo-localized-share-hotfix-v2">\n(function(){\n  try {\n    var lang=String(localStorage.getItem("friendhub_language")||"").toLowerCase();\n    var messages={\n      it:"Unisciti a me su XOXO Avenue — conosci nuove persone, scopri community e fai nuove amicizie!",\n      sv:"Häng med mig på XOXO Avenue — träffa nya människor, upptäck gemenskaper och få nya vänner!",\n      de:"Komm zu XOXO Avenue — lerne neue Menschen kennen, entdecke Communities und finde neue Freunde!"\n    };\n    var localized=messages[lang];\n    if(!localized) return;\n    function rewrite(value){\n      try{\n        if(typeof value!=="string" || !/whatsapp\\.com|wa\\.me/i.test(value)) return value;\n        var u=new URL(value,location.href);\n        if(!/whatsapp\\.com|wa\\.me/i.test(u.hostname)) return value;\n        u.searchParams.set("text",localized+"\\n\\nhttps://xoxoavenue.com/?lang="+encodeURIComponent(lang));\n        return u.href;\n      }catch(_){ return value; }\n    }\n    var oldOpen=window.open;\n    window.open=function(url){\n      var args=Array.prototype.slice.call(arguments);\n      if(typeof args[0]==="string") args[0]=rewrite(args[0]);\n      return oldOpen.apply(window,args);\n    };\n    document.addEventListener("click",function(e){\n      var a=e.target&&e.target.closest?e.target.closest("a"):null;\n      if(!a) return;\n      var href=a.href||a.getAttribute("href")||"";\n      var fixed=rewrite(href);\n      if(fixed!==href){\n        e.preventDefault();\n        e.stopImmediatePropagation();\n        window.open(fixed,"_blank","noopener,noreferrer");\n      }\n    },true);\n  }catch(_){}\n})();\n</script>`, {html:true});\n      }\n    })\n\n    .transform(response);'''
              if needle not in text:
                  raise SystemExit("Expected Worker transform marker was not found")
              text=text.replace(needle,script,1)
              worker.write_text(text,encoding="utf-8")

          inspect=Path(".github/workflows/inspect-share.yml")
          if inspect.exists():
              inspect.unlink()

      - name: Commit fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js .github/workflows/inspect-share.yml .github/workflows/fix-whatsapp-localized-message.yml
          git diff --cached --check
          git commit -m "Fix localized WhatsApp messages"
          git push
