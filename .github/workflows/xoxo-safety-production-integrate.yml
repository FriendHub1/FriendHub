name: XOXO WhatsApp Preview Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/xoxo-safety-production-integrate.yml"
      - "worker.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch server-side WhatsApp preview
        shell: python
        run: |
          from pathlib import Path

          p = Path("worker.js")
          s = p.read_text()

          old = '''function makeDescription(profile) {
  const bio = String(profile?.bio || "").trim();

  if (bio) {
    return bio.slice(0, 180);
  }

  const lookingFor = String(
    profile?.looking_for || ""
  ).trim();

  if (lookingFor) {
    return `Looking for ${lookingFor} on XOXO Avenue.`;
  }

  return "Meet people, make friends, and discover communities on XOXO Avenue.";
}'''

          new = '''function makeDescription(profile, language = "") {
  const bio = String(profile?.bio || "").trim();

  if (bio) return bio.slice(0, 180);

  const lookingFor = String(profile?.looking_for || "").trim();
  if (lookingFor) return `Looking for ${lookingFor} on XOXO Avenue.`;

  const descriptions = {
    es: "Conoce personas, haz nuevos amigos y descubre comunidades en XOXO Avenue.",
    en: "Meet people, make friends, and discover communities on XOXO Avenue.",
    "pt-br": "Conheça pessoas, faça novos amigos e descubra comunidades no XOXO Avenue.",
    fr: "Rencontrez de nouvelles personnes, faites-vous de nouveaux amis et découvrez des communautés sur XOXO Avenue.",
    pl: "Poznawaj ludzi, nawiązuj nowe znajomości i odkrywaj społeczności na XOXO Avenue.",
    de: "Lerne neue Menschen kennen, finde neue Freunde und entdecke Communities auf XOXO Avenue.",
    nb: "Møt nye mennesker, få nye venner og oppdag fellesskap på XOXO Avenue.",
    cs: "Poznávejte nové lidi, najděte nové přátele a objevujte komunity na XOXO Avenue.",
    sv: "Träffa nya människor, få nya vänner och upptäck gemenskaper på XOXO Avenue.",
    it: "Conosci nuove persone, fai nuove amicizie e scopri community su XOXO Avenue."
  };

  return descriptions[String(language || "").toLowerCase()] || descriptions.en;
}'''

          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace(
              'makeDescription(profile)',
              'makeDescription(profile, String(url.searchParams.get("lang") || "").toLowerCase())',
              1,
          )

          old_link = 'https://xoxoavenue.com/?lang="+encodeURIComponent(lang)'
          new_link = 'https://xoxoavenue.com/?lang="+encodeURIComponent(lang)+"&xoxo_share=1'
          s = s.replace(old_link, new_link, 1)

          if 'function makeDescription(profile, language = "")' not in s:
              raise SystemExit("WhatsApp preview patch did not apply")
          if 'xoxo_share=1' not in s:
              raise SystemExit("WhatsApp cache-busting URL patch did not apply")

          p.write_text(s)

      - name: Verify
        run: |
          grep -n "function makeDescription(profile, language" worker.js
          grep -n "xoxo_share=1" worker.js
          git diff --check

      - name: Commit Worker fix
        run: |
          set -euo pipefail
          if git diff --quiet -- worker.js; then
            echo "Worker already contains the WhatsApp preview fix."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git commit -m "Fix localized WhatsApp preview"
          git push
