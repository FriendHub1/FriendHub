name: XOXO Safety BETA - Isolated Cloudflare Deploy

# No production/main deployment. BETA pushes validate the bundle;
# deployment also requires an explicit repo variable and BETA-only secrets.
on:
  push:
    branches:
      - feature/xoxo-safety-reminder-beta
      - main
    paths:
      - ".github/workflows/xoxo-safety-beta-deploy.yml"
      - "wrangler.safety-beta.jsonc"
      - "beta/build-safety-beta-assets.sh"
      - "beta/test-safety-beta-deploy-contract.cjs"
      - "beta/stay-safe-*.js"
      - "beta/admin-report-*.js"
      - "worker.js"
      - "index.html"
      - "profile-frames/**"
      - "*.png"
      - "*.webp"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xoxo-safety-beta-worker
  cancel-in-progress: false

jobs:
  patch-localized-share:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch localized share support
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old_language = '["es","pt-BR","pl","fr","nb","de","cs"]'
          new_language = '["es","pt-BR","pl","fr","nb","de","cs","sv","it"]'
          if old_language in text:
              text = text.replace(old_language, new_language, 1)
          old_supported = '["en", "es", "pt-BR", "fr", "pl", "de", "nb", "cs"]'
          new_supported = '["en", "es", "pt-BR", "fr", "pl", "de", "nb", "cs", "sv", "it"]'
          if old_supported in text:
              text = text.replace(old_supported, new_supported, 1)
          marker = '                                        "cs": "💜 Objevte XOXO Avenue! Poznávejte nové lidi z celého světa, navazujte přátelství a objevujte komunity podle svých zájmů. Připojte se zdarma! ✨"\n'
          additions = marker + '                                        "de": "Komm zu XOXO Avenue — lerne neue Menschen kennen, entdecke Communities und finde neue Freunde!",\n' + '                                        "sv": "Häng med mig på XOXO Avenue — träffa nya människor, upptäck gemenskaper och få nya vänner!",\n' + '                                        "it": "Unisciti a me su XOXO Avenue — conosci nuove persone, scopri community e fai nuove amicizie!"\n'
          if marker in text and '"it": "Unisciti a me su XOXO Avenue' not in text:
              text = text.replace(marker, additions, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit localized share fix and restore workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD^ -- .github/workflows/xoxo-safety-beta-deploy.yml
          git rm .github/workflows/fix-localized-share.yml
          git add index.html .github/workflows/xoxo-safety-beta-deploy.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix localized WhatsApp share messages'
          git push

  verify-beta-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.ref == 'refs/heads/feature/xoxo-safety-reminder-beta' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify isolated Cloudflare Worker contract
        run: node beta/test-safety-beta-deploy-contract.cjs
      - name: Build restricted public assets
        run: bash beta/build-safety-beta-assets.sh
      - name: Bundle BETA without deploying
        run: npx --yes wrangler@4.102.0 deploy --dry-run --config ./wrangler.safety-beta.jsonc

  deploy-safety-beta:
    needs: verify-beta-package
    if: ${{ github.ref == 'refs/heads/feature/xoxo-safety-reminder-beta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: xoxo-safety-beta
    env:
      XOXO_SAFETY_BETA_DEPLOY_ENABLED: ${{ vars.XOXO_SAFETY_BETA_DEPLOY_ENABLED }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.XOXO_SAFETY_BETA_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.XOXO_SAFETY_BETA_CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require isolated Cloudflare credentials
        run: |
          set -euo pipefail
          test "$(printf '%s' "$XOXO_SAFETY_BETA_DEPLOY_ENABLED" | tr -d '[:space:]')" = 'true' || { echo 'BETA deployment flag must be true'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing XOXO_SAFETY_BETA_CF_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing XOXO_SAFETY_BETA_CF_ACCOUNT_ID'; exit 1; }
          node beta/test-safety-beta-deploy-contract.cjs
      - name: Build restricted public assets
        run: bash beta/build-safety-beta-assets.sh
      - name: Deploy ONLY xoxo-safety-beta on workers.dev
        run: npx --yes wrangler@4.102.0 deploy --config ./wrangler.safety-beta.jsonc

# Owner-authorized isolated BETA deployment trigger (2026-10-25).
