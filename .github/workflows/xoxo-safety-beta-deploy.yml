name: XOXO Safety BETA - Isolated Cloudflare Deploy

# No production/main trigger. BETA pushes validate the bundle;
# deployment also requires an explicit repo variable and BETA-only secrets.
on:
  push:
    branches:
      - feature/xoxo-safety-reminder-beta
    paths:
      - ".github/workflows/xoxo-safety-beta-deploy.yml"
      - "wrangler.safety-beta.jsonc"
      - "beta/build-safety-beta-assets.sh"
      - "beta/test-safety-beta-deploy-contract.cjs"
      - "beta/stay-safe-*.js"
      - "beta/admin-report-*.js"
      - "worker.js"
      - "index.html"
      - "profile-frames/**"
      - "*.png"
      - "*.webp"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xoxo-safety-beta-worker
  cancel-in-progress: false

jobs:
  verify-beta-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify isolated Cloudflare Worker contract
        run: node beta/test-safety-beta-deploy-contract.cjs
      - name: Build restricted public assets
        run: bash beta/build-safety-beta-assets.sh
      - name: Bundle BETA without deploying
        run: npx --yes wrangler@4.102.0 deploy --dry-run --config ./wrangler.safety-beta.jsonc

  deploy-safety-beta:
    needs: verify-beta-package
    if: ${{ github.ref == 'refs/heads/feature/xoxo-safety-reminder-beta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: xoxo-safety-beta
    env:
      XOXO_SAFETY_BETA_DEPLOY_ENABLED: ${{ vars.XOXO_SAFETY_BETA_DEPLOY_ENABLED }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.XOXO_SAFETY_BETA_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.XOXO_SAFETY_BETA_CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require isolated Cloudflare credentials
        run: |
          set -euo pipefail
          test "$XOXO_SAFETY_BETA_DEPLOY_ENABLED" = 'true' || { echo 'BETA deployment flag must be true'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing XOXO_SAFETY_BETA_CF_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing XOXO_SAFETY_BETA_CF_ACCOUNT_ID'; exit 1; }
          node beta/test-safety-beta-deploy-contract.cjs
      - name: Build restricted public assets
        run: bash beta/build-safety-beta-assets.sh
      - name: Deploy ONLY xoxo-safety-beta on workers.dev
        run: npx --yes wrangler@4.102.0 deploy --config ./wrangler.safety-beta.jsonc

# Owner-authorized isolated BETA deployment trigger (2026-10-25).
