name: Fix localized share messages

on:
  push:
    paths:
      - '.github/workflows/fix-localized-share.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch localized share support
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_language = '["es","pt-BR","pl","fr","nb","de","cs"]'
          new_language = '["es","pt-BR","pl","fr","nb","de","cs","sv","it"]'
          if old_language not in text:
              raise SystemExit('Expected language list not found')
          text = text.replace(old_language, new_language, 1)

          old_supported = '["en", "es", "pt-BR", "fr", "pl", "de", "nb", "cs"]'
          new_supported = '["en", "es", "pt-BR", "fr", "pl", "de", "nb", "cs", "sv", "it"]'
          if old_supported not in text:
              raise SystemExit('Expected share URL language list not found')
          text = text.replace(old_supported, new_supported, 1)

          marker = '                                        "cs": "💜 Objevte XOXO Avenue! Poznávejte nové lidi z celého světa, navazujte přátelství a objevujte komunity podle svých zájmů. Připojte se zdarma! ✨"\n'
          additions = marker + '                                        "de": "Komm zu XOXO Avenue — lerne neue Menschen kennen, entdecke Communities und finde neue Freunde!",\n' + '                                        "sv": "Häng med mig på XOXO Avenue — träffa nya människor, upptäck gemenskaper och få nya vänner!",\n' + '                                        "it": "Unisciti a me su XOXO Avenue — conosci nuove persone, scopri community e fai nuove amicizie!"\n'
          if marker not in text:
              raise SystemExit('Expected share message marker not found')
          text = text.replace(marker, additions, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-localized-share.yml
          git commit -m 'Fix localized WhatsApp share messages'
          git push