name: XOXO Streaks Validation

on:
  push:
    branches: ["main"]
    paths:
      - "xoxo-streaks.js"
      - "xoxo-discovery-performance.js"
      - "beta/test-xoxo-streaks-logic.cjs"
      - ".github/workflows/xoxo-streaks-validation.yml"
  pull_request:
    paths:
      - "xoxo-streaks.js"
      - "beta/test-xoxo-streaks-logic.cjs"
      - ".github/workflows/xoxo-streaks-validation.yml"

permissions:
  contents: read

jobs:
  validate-streaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check streak script syntax
        run: node --check xoxo-streaks.js
      - name: Check discovery performance script syntax
        run: node --check xoxo-discovery-performance.js
      - name: Test streak rules and message trigger guards
        run: node beta/test-xoxo-streaks-logic.cjs
