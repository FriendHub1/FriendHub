name: Inspect share code

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect WhatsApp share implementation
        shell: bash
        run: |
          set -e
          grep -n -E 'Join me on XOXO Avenue|Unisciti a me su XOXO Avenue|Häng med mig på XOXO Avenue|Komm zu XOXO Avenue|wa.me|api.whatsapp.com|WhatsApp' index.html | head -120 || true
