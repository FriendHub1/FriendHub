name: Fix WhatsApp language detection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-whatsapp-language-detection.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make WhatsApp localization use the active site language
        shell: python
        run: |
          from pathlib import Path
          p = Path("worker.js")
          text = p.read_text(encoding="utf-8")
          old = 'var lang=String(localStorage.getItem("friendhub_language")||"").toLowerCase();'
          new = '''var lang=(function(){
      try{
        var q=new URLSearchParams(location.search).get("lang");
        if(q) return String(q).toLowerCase();
        var saved=localStorage.getItem("friendhub_language");
        if(saved) return String(saved).toLowerCase();
        return String(document.documentElement.lang||"en").toLowerCase();
      }catch(_){ return String(document.documentElement.lang||"en").toLowerCase(); }
    })();'''
          if old not in text:
              raise SystemExit("WhatsApp hotfix language line not found")
          text=text.replace(old,new,1)
          p.write_text(text,encoding="utf-8")

          for name in [".github/workflows/inspect-share.yml", ".github/workflows/fix-whatsapp-localized-message.yml", ".github/workflows/fix-whatsapp-language-detection.yml"]:
              x=Path(name)
              if x.exists() and name != ".github/workflows/fix-whatsapp-language-detection.yml": x.unlink()

      - name: Commit and clean temporary workflows
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js .github/workflows
          git diff --cached --check
          git commit -m "Fix WhatsApp language detection"
          git push
