name: XOXO Safety BETA Tests

on:
  push:
    branches:
      - feature/xoxo-safety-reminder-beta
  pull_request:
    paths:
      - "beta/**"
      - ".github/workflows/xoxo-safety-beta-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for f in beta/*.cjs; do node --check "$f"; done
      - name: Run report evidence regression suites
        run: |
          set -eu
          for test_file in beta/test-*.cjs; do
            echo "Running $test_file"
            node "$test_file"
          done
