name: XOXO Safety BETA Tests

on:
  push:
    branches:
      - feature/xoxo-safety-reminder-beta
  pull_request:
    paths:
      - "beta/**"
      - ".github/workflows/xoxo-safety-beta-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check worker.js
          for f in beta/*.cjs beta/*.js; do node --check "$f"; done
      - name: Run report evidence regression suites
        run: |
          set -eu
          for test_file in beta/test-*.cjs; do
            # Real browser integration runs in safety-browser with pinned Playwright.
            if [ "$test_file" = "beta/test-safety-browser-visual.cjs" ]; then continue; fi
            echo "Running $test_file"
            node "$test_file"
          done

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xoxo_safety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xoxo_safety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: xoxo_safety_test
    steps:
      - uses: actions/checkout@v4
      - name: Ensure local disposable test database
        run: |
          set -euo pipefail
          psql -XAtqc "select current_database()" | grep -Fx xoxo_safety_test
      - name: Set up isolated test fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f beta/sql-test-fixtures.sql
      - name: Create safety BETA SQL within ephemeral PostgreSQL 17
        run: psql -X -v ON_ERROR_STOP=1 -f beta/stay-safe-conversation-reports-schema.sql
      - name: Execute authenticated report and moderation security tests
        run: psql -X -v ON_ERROR_STOP=1 -f beta/sql-test-report-pipeline.sql
      - name: Stress-test parallel rate limits and idempotency on disposable DB
        run: python3 beta/test-safety-postgres-concurrency.py
      - name: Seed isolated PostgREST HTTP session fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f beta/sql-test-postgrest-fixtures.sql
      - name: Start pinned PostgREST HTTP API on runner loopback only
        env:
          XOXO_HTTP_JWT_KEY: xoxo-local-ci-jwt-secret-not-for-production-1234567890
        run: |
          set -euo pipefail
          docker run -d --name xoxo-safety-ci-postgrest --network host \
            -e PGRST_DB_URI="postgres://xoxo_ci_authenticator:local-ci-only-password@127.0.0.1:5432/xoxo_safety_test" \
            -e PGRST_DB_SCHEMAS="public" \
            -e PGRST_DB_ANON_ROLE="anon" \
            -e PGRST_JWT_SECRET="$XOXO_HTTP_JWT_KEY" \
            -e PGRST_SERVER_HOST="127.0.0.1" \
            -e PGRST_SERVER_PORT="3001" \
            -e PGRST_LOG_LEVEL="error" \
            postgrest/postgrest:v12.2.12
          ready=0
          for i in $(seq 1 35); do
            code="$(curl --max-time 2 -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/ || true)"
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs xoxo-safety-ci-postgrest
            echo "ERROR: Ephemeral PostgREST HTTP API did not become ready" >&2
            exit 1
          fi
      - name: Test real signed JWTs through PostgREST HTTP and RPC permissions
        run: python3 beta/test-safety-postgrest-http.py
      - name: Verify old pending reports survive a 120-case closed-report flood
        run: psql -X -v ON_ERROR_STOP=1 -f beta/sql-test-admin-queue-priority.sql
      - name: Verify pending-first 100-card queue over signed local HTTP API
        run: python3 beta/test-safety-postgrest-queue-priority.py
      - name: Paginate all reports beyond 100 using PIN-protected SQL cursor
        run: psql -X -v ON_ERROR_STOP=1 -f beta/sql-test-admin-pagination.sql
      - name: Check every report page via authenticated local PostgREST HTTP
        run: python3 beta/test-safety-postgrest-pagination.py
      - name: Check immutable report metadata after physical DM deletion in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f beta/sql-test-evidence-after-delete.sql
      - name: Run real Supabase GoTrue Auth in a separate disposable database
        env:
          XOXO_HTTP_JWT_KEY: xoxo-local-ci-jwt-secret-not-for-production-1234567890
        run: |
          set -euo pipefail
          test "${PGDATABASE}" = xoxo_safety_test
          psql -X -v ON_ERROR_STOP=1 -c "create database xoxo_gotrue_ci"
          psql -X -v ON_ERROR_STOP=1 -d xoxo_gotrue_ci -c "create schema if not exists auth"
          # GoTrue's container CMD starts the API; unlike the complete
          # Supabase stack, this standalone test must apply its official
          # Auth migrations explicitly before issuing signed sessions.
          docker run --rm --network host \
            -e API_EXTERNAL_URL=http://127.0.0.1:9999 \
            -e GOTRUE_SITE_URL=http://127.0.0.1:9999 \
            -e GOTRUE_DB_DRIVER=postgres \
            -e GOTRUE_DB_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/xoxo_gotrue_ci?sslmode=disable" \
            -e GOTRUE_DB_DB_NAMESPACE=auth \
            -e GOTRUE_JWT_SECRET="$XOXO_HTTP_JWT_KEY" \
            -e GOTRUE_JWT_AUD=authenticated \
            -e GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated \
            supabase/gotrue:v2.197.0 auth migrate
          # GoTrue executes unqualified identities/sessions queries. The
          # disposable PostgreSQL account must search auth before public.
          psql -X -v ON_ERROR_STOP=1 -d xoxo_gotrue_ci -c \
            "alter role postgres in database xoxo_gotrue_ci set search_path = auth, public"
          psql -XAtq -d xoxo_gotrue_ci -c \
            "select to_regclass('auth.identities') is not null and to_regclass('auth.users') is not null" | grep -Fx t
          docker run -d --name xoxo-safety-ci-gotrue --network host \
            -e GOTRUE_API_HOST=127.0.0.1 \
            -e GOTRUE_API_PORT=9999 \
            -e API_EXTERNAL_URL=http://127.0.0.1:9999 \
            -e GOTRUE_DB_DRIVER=postgres \
            -e GOTRUE_DB_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/xoxo_gotrue_ci?sslmode=disable" \
            -e GOTRUE_DB_DB_NAMESPACE=auth \
            -e GOTRUE_SITE_URL=http://127.0.0.1:9999 \
            -e GOTRUE_DISABLE_SIGNUP=false \
            -e GOTRUE_EXTERNAL_EMAIL_ENABLED=true \
            -e GOTRUE_MAILER_AUTOCONFIRM=true \
            -e GOTRUE_JWT_SECRET="$XOXO_HTTP_JWT_KEY" \
            -e GOTRUE_JWT_AUD=authenticated \
            -e GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated \
            -e GOTRUE_JWT_EXP=3600 \
            -e GOTRUE_LOG_LEVEL=warn \
            supabase/gotrue:v2.197.0
          ready=0
          for i in $(seq 1 60); do
            if curl --max-time 2 -fsS http://127.0.0.1:9999/health >/dev/null 2>&1; then
              ready=1;break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs --tail 80 xoxo-safety-ci-gotrue
            echo "ERROR: isolated Supabase GoTrue did not start" >&2
            exit 1
          fi
      - name: Verify genuine Auth-issued access token through signed local PostgREST
        run: python3 beta/test-safety-gotrue-auth-http.py
      - name: Clean up disposable PostgREST and GoTrue containers
        if: always()
        run: |
          docker rm -f xoxo-safety-ci-gotrue 2>/dev/null || true
          docker rm -f xoxo-safety-ci-postgrest 2>/dev/null || true

  safety-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact browser-test version and supported engines
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xoxo-safety-playwright"
          npm --prefix "$RUNNER_TEMP/xoxo-safety-playwright" install \
            --no-save --no-package-lock --ignore-scripts playwright@1.64.1
          "$RUNNER_TEMP/xoxo-safety-playwright/node_modules/.bin/playwright" \
            install --with-deps chromium webkit
      - name: Check 320px and 390px WebKit mobile plus Chromium desktop
        run: |
          NODE_PATH="$RUNNER_TEMP/xoxo-safety-playwright/node_modules" \
            node beta/test-safety-browser-visual.cjs
      - name: Check moderator logout/account-switch privacy in native WebKit and Chromium
        run: |
          NODE_PATH="$RUNNER_TEMP/xoxo-safety-playwright/node_modules" \
            node beta/browser-safety-admin-auth.cjs
      - name: Check old DM report/evidence dialogs close on chat navigation in native WebKit and Chromium
        run: |
          NODE_PATH="$RUNNER_TEMP/xoxo-safety-playwright/node_modules" \
            node beta/browser-safety-chat-navigation.cjs
      - name: Upload synthetic BETA screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xoxo-safety-mobile-desktop-screenshots
          path: beta/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
