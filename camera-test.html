<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XOXO Camera Lab</title>
<style>body{margin:0;background:#170d28;color:#f9eafa;font:16px system-ui;padding:22px;max-width:720px;margin:auto}h1{color:#ffb7eb}button,label{display:block;background:#803bc2;color:white;padding:15px;border:0;border-radius:14px;margin:12px 0;cursor:pointer;font-size:16px}video,img{width:100%;max-height:380px;object-fit:contain;background:#08050e;border-radius:14px}small{color:#d5b9ed}section{padding:14px;border:1px solid #624176;border-radius:16px;margin:15px 0}#log{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body>
<h1>📸 XOXO Camera Lab 💜</h1><p>Prueba la cámara nativa del iPhone y la cámara web de Safari. No se envían archivos al servidor.</p>
<section><h2>1. Cámara nativa</h2><label>📷 Tomar foto<input id="photo" type="file" accept="image/*" capture="environment" hidden></label><label>🎥 Grabar video<input id="video" type="file" accept="video/*" capture="environment" hidden></label><label>🖼️ Elegir de Camera Roll<input id="roll" type="file" accept="image/*,video/*" hidden></label></section>
<section><h2>2. Cámara web Safari</h2><button id="start">▶️ Abrir cámara web</button><button id="stop">⏹️ Cerrar cámara web</button><video id="live" autoplay muted playsinline></video><button id="snap">📸 Capturar foto de prueba</button><small>El navegador puede elegir una resolución inferior a la cámara nativa.</small></section>
<section><h2>Resultado</h2><p id="log">Selecciona una opción para comenzar.</p><div id="preview"></div></section>
<script>
const log=document.getElementById('log'),preview=document.getElementById('preview'),live=document.getElementById('live');let stream=null,blobUrl=null;
function clearPreview(){preview.replaceChildren();if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null}}
function showFile(file){if(!file)return;clearPreview();blobUrl=URL.createObjectURL(file);const media=document.createElement(file.type.startsWith('video/')?'video':'img');media.src=blobUrl;if(media.tagName==='VIDEO'){media.controls=true;media.playsInline=true;media.onloadedmetadata=()=>log.textContent+='\nResolución del video: '+media.videoWidth+' × '+media.videoHeight;}else{media.onload=()=>log.textContent+='\nResolución de foto: '+media.naturalWidth+' × '+media.naturalHeight;}preview.append(media);log.textContent='Tipo: '+file.type+'\nTamaño: '+(file.size/1048576).toFixed(2)+' MB';}
for(const id of ['photo','video','roll'])document.getElementById(id).addEventListener('change',e=>showFile(e.target.files[0]));
document.getElementById('start').onclick=async()=>{try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});live.srcObject=stream;await live.play();const s=stream.getVideoTracks()[0].getSettings();log.textContent='Cámara web activa\nResolución solicitada: 1920 × 1080\nResolución real: '+s.width+' × '+s.height+'\nVista previa: '+live.videoWidth+' × '+live.videoHeight;}catch(e){log.textContent='Error al abrir cámara web: '+e.message;}};
document.getElementById('stop').onclick=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}live.srcObject=null;log.textContent='Cámara web cerrada.'};
document.getElementById('snap').onclick=()=>{if(!stream||!live.videoWidth){log.textContent='Primero abre la cámara web.';return;}const c=document.createElement('canvas');c.width=live.videoWidth;c.height=live.videoHeight;c.getContext('2d').drawImage(live,0,0);c.toBlob(b=>showFile(new File([b],'camera-test.jpg',{type:'image/jpeg'})),'image/jpeg',0.95)};
window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
</script></body></html>
